<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600" />
    <title>Frameworks & Checklists</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #020216;
        color: #fff2e2;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      /* Noise Overlay */
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.02;
        pointer-events: none;
        z-index: 100;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #020216;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      .grid-bg {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(255, 242, 226, 0.02) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255, 242, 226, 0.02) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }

      .glow-bg {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(187, 85, 4, 0.06) 0%, rgba(187, 85, 4, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Header */
      .header-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .category {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: #bb5504;
        letter-spacing: 2px;
      }

      .title {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        font-weight: 600;
        color: #fff2e2;
        line-height: 1.2;
      }

      /* Checklist Card Container */
      .checklist-card {
        position: relative;
        width: 100%;
        height: 320px;
        border: 1px solid rgba(255, 242, 226, 0.08);
        border-radius: 16px;
        background: rgba(17, 17, 43, 0.3);
        backdrop-filter: blur(4px);
        padding: 24px 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        margin-top: 15px;
      }

      .list-items {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .item-row {
        display: flex;
        align-items: center;
        gap: 16px;
        opacity: 0.4;
      }

      .checkbox-box {
        position: relative;
        width: 26px;
        height: 26px;
        border: 2px solid rgba(255, 242, 226, 0.3);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        transition: all 0.3s;
      }

      .checkmark-svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: #fff2e2;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 20;
        stroke-dashoffset: 20;
      }

      .item-text {
        font-size: 16px;
        font-weight: 600;
        color: #fff2e2;
        letter-spacing: 0.5px;
      }

      /* Active States */
      .item-row.active {
        opacity: 1;
        transform: translateX(0);
        transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .item-row.active .checkbox-box {
        border-color: #bb5504;
        background: rgba(187, 85, 4, 0.2);
        box-shadow: 0 0 10px rgba(187, 85, 4, 0.4);
      }

      .item-row.active .item-text {
        color: #fff2e2;
        text-shadow: 0 0 8px rgba(255, 242, 226, 0.2);
      }

      /* Progress Bar Container */
      .progress-area {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .progress-text-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        color: #bb5504;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .progress-bg {
        width: 100%;
        height: 6px;
        background: rgba(255, 242, 226, 0.05);
        border-radius: 3px;
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(to right, #bb5504, #ff8c32);
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(187, 85, 4, 0.6);
      }
    </style>
  </head>
  <body>
    <div data-composition-id="root" data-width="600" data-height="600" data-start="0">
      <div id="scene-frameworks" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="grid-bg"></div>
        <div class="glow-bg"></div>
        <div class="scene-content">
          <div class="header-area">
            <span class="category">Pillar II • Bộ khung tư duy</span>
            <h2 class="title">Frameworks & Checklist</h2>
          </div>
          
          <div class="checklist-card">
            <div class="list-items">
              <!-- Item 1 -->
              <div class="item-row" id="row-1">
                <div class="checkbox-box">
                  <svg class="checkmark-svg" id="check-1" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="item-text">01. Thấu hiểu mô hình kinh doanh</span>
              </div>
              
              <!-- Item 2 -->
              <div class="item-row" id="row-2">
                <div class="checkbox-box">
                  <svg class="checkmark-svg" id="check-2" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="item-text">02. Xác định biên an toàn & Định giá</span>
              </div>
              
              <!-- Item 3 -->
              <div class="item-row" id="row-3">
                <div class="checkbox-box">
                  <svg class="checkmark-svg" id="check-3" viewBox="0 0 24 24">
                    <polyline points="20 6 9 17 4 12"></polyline>
                  </svg>
                </div>
                <span class="item-text">03. Kế hoạch quản trị rủi ro</span>
              </div>
            </div>
            
            <div class="progress-area">
              <div class="progress-text-row">
                <span>Tiến độ phân tích</span>
                <span id="progress-val">0%</span>
              </div>
              <div class="progress-bg">
                <div class="progress-fill"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial states
      gsap.set(["#row-1", "#row-2", "#row-3"], { x: -10 });

      // Entrances for rows
      tl.to("#row-1", { opacity: 1, x: 0, duration: 0.4 }, 0.2);
      tl.to("#row-2", { opacity: 1, x: 0, duration: 0.4 }, 0.4);
      tl.to("#row-3", { opacity: 1, x: 0, duration: 0.4 }, 0.6);

      // Check item 1
      tl.to("#row-1", { className: "item-row active", duration: 0.1 }, 0.8);
      tl.to("#check-1", { strokeDashoffset: 0, duration: 0.3 }, 0.8);
      tl.to(".progress-fill", { width: "33%", duration: 0.4, ease: "power2.out" }, 0.8);
      tl.to("#progress-val", {
        textContent: "33%",
        duration: 0.4,
        snap: { textContent: 1 }
      }, 0.8);

      // Check item 2
      tl.to("#row-2", { className: "item-row active", duration: 0.1 }, 1.5);
      tl.to("#check-2", { strokeDashoffset: 0, duration: 0.3 }, 1.5);
      tl.to(".progress-fill", { width: "66%", duration: 0.4, ease: "power2.out" }, 1.5);
      tl.to("#progress-val", {
        textContent: "66%",
        duration: 0.4,
        snap: { textContent: 1 }
      }, 1.5);

      // Check item 3
      tl.to("#row-3", { className: "item-row active", duration: 0.1 }, 2.2);
      tl.to("#check-3", { strokeDashoffset: 0, duration: 0.3 }, 2.2);
      tl.to(".progress-fill", { width: "100%", duration: 0.4, ease: "power2.out" }, 2.2);
      tl.to("#progress-val", {
        textContent: "100%",
        duration: 0.4,
        snap: { textContent: 1 }
      }, 2.2);

      // Outro and reset
      tl.to([".item-row", ".checkmark-svg", ".progress-fill", "#progress-val"], {
        opacity: 0,
        duration: 0.3
      }, 3.5);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
