<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600" />
    <title>Behavioral Control</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
        color: #f1f5f9;
        font-family: 'Outfit', sans-serif;
      }

      /* Noise Overlay */
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.035;
        pointer-events: none;
        z-index: 100;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      .grid-bg {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(241, 245, 249, 0.015) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(241, 245, 249, 0.015) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }

      .glow-bg {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(230, 28, 92, 0.08) 0%, rgba(230, 28, 92, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Header */
      .header-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .category {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: #e61c5c;
        letter-spacing: 2px;
      }

      .title {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        font-weight: 600;
        color: #f1f5f9;
        line-height: 1.2;
      }

      /* Gauge Dial Area */
      .dial-container {
        position: relative;
        width: 100%;
        height: 320px;
        border: 1px solid rgba(241, 245, 249, 0.08);
        border-radius: 16px;
        background: rgba(17, 22, 37, 0.5);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-top: 15px;
      }

      /* Indicator labels */
      .dial-label {
        position: absolute;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .label-fomo { top: 180px; left: 60px; color: #ef4444; opacity: 0.4; }
      .label-fud { top: 180px; right: 60px; color: #3b82f6; opacity: 0.4; }
      .label-calm { bottom: 30px; color: #e61c5c; font-size: 15px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: 0.4; }

      /* Gauge elements */
      .gauge-svg {
        width: 320px;
        height: 200px;
      }

      .gauge-track {
        fill: none;
        stroke: rgba(241, 245, 249, 0.05);
        stroke-width: 12;
        stroke-linecap: round;
      }

      .gauge-active {
        fill: none;
        stroke-width: 12;
        stroke-linecap: round;
        transition: stroke 0.3s;
      }

      /* Pointer Needle */
      .needle {
        position: absolute;
        width: 4px;
        height: 100px;
        background: linear-gradient(to top, #f1f5f9 20%, #e61c5c);
        bottom: 90px;
        left: calc(50% - 2px);
        transform-origin: bottom center;
        border-radius: 4px;
        box-shadow: 0 0 10px rgba(230, 28, 92, 0.4);
      }

      .needle-pivot {
        position: absolute;
        width: 24px;
        height: 24px;
        background: #090d16;
        border: 4px solid #e61c5c;
        border-radius: 50%;
        bottom: 78px;
        left: calc(50% - 12px);
        box-shadow: 0 0 10px rgba(230, 28, 92, 0.8);
      }

      .focus-glow {
        position: absolute;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(230, 28, 92, 0.4) 0%, rgba(230, 28, 92, 0) 70%);
        bottom: 60px;
        left: calc(50% - 30px);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="root" data-width="600" data-height="600" data-start="0">
      <div id="scene-psy" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="grid-bg"></div>
        <div class="glow-bg"></div>
        <div class="scene-content">
          <div class="header-area">
            <span class="category">Pillar III • Tâm lý</span>
            <h2 class="title">Behavioral Control</h2>
          </div>
          
          <div class="dial-container">
            <span class="dial-label label-fomo">FOMO</span>
            <span class="dial-label label-fud">FUD</span>
            <span class="dial-label label-calm">Tỉnh Thức</span>
            
            <svg class="gauge-svg" viewBox="0 0 200 120">
              <!-- Arc from 180 to 0 degrees -->
              <path class="gauge-track" d="M 20 100 A 80 80 0 0 1 180 100" />
            </svg>
            
            <div class="focus-glow"></div>
            <div class="needle"></div>
            <div class="needle-pivot"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial states
      gsap.set(".focus-glow", { scale: 0.5 });
      gsap.set(".needle", { rotation: -80 }); // Start pointing at FOMO

      // Sequence of needle swings:
      // 1. Swing wildly left to FOMO (approx -80 deg)
      // 2. Swing wildly right to FUD (approx 80 deg)
      // 3. Swing back left but smaller (approx -40 deg)
      // 4. Swing back right smaller (approx 40 deg)
      // 5. Stabilize to center (0 deg) and glow.
      
      tl.to(".needle", { rotation: 80, duration: 0.8, ease: "power2.inOut" }, 0.2); // Swing to FUD
      tl.to(".label-fomo", { opacity: 1, duration: 0.2 }, 0.2);
      tl.to(".label-fomo", { opacity: 0.4, duration: 0.4 }, 0.6);
      
      tl.to(".needle", { rotation: -50, duration: 0.7, ease: "power2.inOut" }, 1.0); // Swing back
      tl.to(".label-fud", { opacity: 1, duration: 0.2 }, 1.0);
      tl.to(".label-fud", { opacity: 0.4, duration: 0.4 }, 1.4);
      
      tl.to(".needle", { rotation: 30, duration: 0.6, ease: "power2.inOut" }, 1.7);
      
      tl.to(".needle", { rotation: 0, duration: 0.7, ease: "elastic.out(1, 0.5)" }, 2.3); // Settle at 0 (Calm)
      
      // Reveal calm glow and active text
      tl.to(".focus-glow", {
        opacity: 1,
        scale: 1.3,
        duration: 0.6,
        ease: "power2.out"
      }, 2.6);
      
      tl.to(".label-calm", {
        opacity: 1,
        color: "#e61c5c",
        textShadow: "0 0 10px rgba(230, 28, 92, 0.6)",
        duration: 0.6
      }, 2.6);

      // Outro and reset
      tl.to(".focus-glow", { opacity: 0, scale: 0.5, duration: 0.3 }, 3.5);
      tl.to(".label-calm", { opacity: 0.4, textShadow: "none", duration: 0.3 }, 3.5);
      tl.to(".needle", { rotation: -80, duration: 0.4, ease: "power2.in" }, 3.5);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
