<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600" />
    <title>Series & Roadmaps</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
        color: #f1f5f9;
        font-family: 'Outfit', sans-serif;
      }

      /* Noise Overlay */
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.035;
        pointer-events: none;
        z-index: 100;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      .grid-bg {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(241, 245, 249, 0.015) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(241, 245, 249, 0.015) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }

      .glow-bg {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(230, 28, 92, 0.08) 0%, rgba(230, 28, 92, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Header */
      .header-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .category {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: #e61c5c;
        letter-spacing: 2px;
      }

      .title {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        font-weight: 600;
        color: #f1f5f9;
        line-height: 1.2;
      }

      /* Roadmap Container */
      .roadmap-container {
        position: relative;
        width: 100%;
        height: 320px;
        border: 1px solid rgba(241, 245, 249, 0.08);
        border-radius: 16px;
        background: rgba(17, 22, 37, 0.5);
        backdrop-filter: blur(4px);
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        margin-top: 15px;
      }

      /* Horizontal line */
      .roadmap-svg {
        position: absolute;
        top: 130px;
        left: 40px;
        width: calc(100% - 80px);
        height: 8px;
        overflow: visible;
      }

      .roadmap-line-bg {
        fill: none;
        stroke: rgba(241, 245, 249, 0.05);
        stroke-width: 4;
      }

      .roadmap-line-active {
        fill: none;
        stroke: #e61c5c;
        stroke-width: 4;
        stroke-dasharray: 440;
        stroke-dashoffset: 440;
        filter: drop-shadow(0 0 4px rgba(230, 28, 92, 0.5));
      }

      /* Nodes */
      .nodes-container {
        position: absolute;
        top: 110px;
        left: 40px;
        width: calc(100% - 80px);
        display: flex;
        justify-content: space-between;
      }

      .node-wrapper {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 120px;
      }

      .node-circle {
        width: 20px;
        height: 20px;
        border: 3px solid rgba(241, 245, 249, 0.2);
        border-radius: 50%;
        background: #090d16;
        z-index: 10;
        transition: all 0.3s;
      }

      .node-wrapper.active .node-circle {
        border-color: #e61c5c;
        background: #f1f5f9;
        box-shadow: 0 0 12px rgba(230, 28, 92, 0.8);
        transform: scale(1.2);
      }

      .node-label {
        position: absolute;
        top: 35px;
        text-align: center;
        width: 140px;
        font-size: 13px;
        font-weight: 700;
        color: #f1f5f9;
        opacity: 0.3;
        transform: translateY(5px);
        transition: all 0.4s;
      }

      .node-subtext {
        position: absolute;
        top: 60px;
        text-align: center;
        width: 140px;
        font-size: 10px;
        font-weight: 600;
        color: #e61c5c;
        opacity: 0;
        transform: translateY(5px);
        transition: all 0.4s;
      }

      .node-wrapper.active .node-label {
        opacity: 1;
        transform: translateY(0);
      }

      .node-wrapper.active .node-subtext {
        opacity: 0.8;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div data-composition-id="root" data-width="600" data-height="600" data-start="0">
      <div id="scene-series" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="grid-bg"></div>
        <div class="glow-bg"></div>
        <div class="scene-content">
          <div class="header-area">
            <span class="category">Học tập • Lộ trình</span>
            <h2 class="title">Series Lộ Trình Học</h2>
          </div>
          
          <div class="roadmap-container">
            <svg class="roadmap-svg">
              <line class="roadmap-line-bg" x1="0" y1="4" x2="440" y2="4" />
              <line class="roadmap-line-active" id="active-line" x1="0" y1="4" x2="440" y2="4" />
            </svg>
            
            <div class="nodes-container">
              <!-- Node 1 -->
              <div class="node-wrapper" id="node-1">
                <div class="node-circle"></div>
                <span class="node-label">01. Nhập Môn</span>
                <span class="node-subtext">TƯ DUY ĐẦU TƯ</span>
              </div>
              
              <!-- Node 2 -->
              <div class="node-wrapper" id="node-2">
                <div class="node-circle"></div>
                <span class="node-label">02. Báo Cáo Tài Chính</span>
                <span class="node-subtext">ĐỌC HIỂU DOANH NGHIỆP</span>
              </div>
              
              <!-- Node 3 -->
              <div class="node-wrapper" id="node-3">
                <div class="node-circle"></div>
                <span class="node-label">03. Định Giá & Biên</span>
                <span class="node-subtext">LÀM CHỦ PHÂN TÍCH</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Active Node 1
      tl.to("#node-1", { className: "node-wrapper active", duration: 0.1 }, 0.3);
      
      // Draw line from Node 1 to Node 2 (approx half of 440px)
      tl.to("#active-line", { strokeDashoffset: 220, duration: 0.8, ease: "power1.inOut" }, 0.5);
      
      // Active Node 2
      tl.to("#node-2", { className: "node-wrapper active", duration: 0.1 }, 1.3);
      
      // Draw line from Node 2 to Node 3 (approx full 440px)
      tl.to("#active-line", { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, 1.5);
      
      // Active Node 3
      tl.to("#node-3", { className: "node-wrapper active", duration: 0.1 }, 2.3);

      // Outro and reset
      tl.to([".node-wrapper", "#active-line"], {
        opacity: 0,
        duration: 0.3
      }, 3.5);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
