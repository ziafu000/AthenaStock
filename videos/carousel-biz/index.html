<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=600, height=600" />
    <title>Business Analysis</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
        color: #f1f5f9;
        font-family: 'Outfit', sans-serif;
      }

      /* Noise Overlay */
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0.035;
        pointer-events: none;
        z-index: 100;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 600px;
        height: 600px;
        overflow: hidden;
        background: #090d16;
      }

      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 10;
      }

      /* Grid Ambient */
      .grid-bg {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(241, 245, 249, 0.015) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(241, 245, 249, 0.015) 1px, transparent 1px);
        background-size: 24px 24px;
        pointer-events: none;
      }

      .glow-bg {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(230, 28, 92, 0.08) 0%, rgba(230, 28, 92, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }

      /* Header */
      .header-area {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .category {
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        color: #e61c5c;
        letter-spacing: 2px;
      }

      .title {
        font-family: 'Playfair Display', serif;
        font-size: 32px;
        font-weight: 600;
        color: #f1f5f9;
        line-height: 1.2;
      }

      /* Chart container */
      .chart-container {
        position: relative;
        width: 100%;
        height: 320px;
        border: 1px solid rgba(241, 245, 249, 0.08);
        border-radius: 16px;
        background: rgba(17, 22, 37, 0.5);
        backdrop-filter: blur(4px);
        overflow: hidden;
        margin-top: 15px;
      }

      /* Intrinsic value line */
      .intrinsic-line {
        position: absolute;
        top: 140px;
        left: 0;
        width: 100%;
        height: 2px;
        background: #e61c5c;
        box-shadow: 0 0 12px rgba(230, 28, 92, 0.6);
      }

      .intrinsic-label {
        position: absolute;
        top: 112px;
        right: 20px;
        font-size: 10px;
        color: #e61c5c;
        font-weight: 700;
        letter-spacing: 1px;
        background: #090d16;
        padding: 2px 8px;
        border: 1px solid rgba(230, 28, 92, 0.3);
        border-radius: 4px;
      }

      /* Safety Margin Zone */
      .safety-zone {
        position: absolute;
        top: 140px;
        left: 0;
        width: 100%;
        height: 120px;
        background: linear-gradient(to bottom, rgba(230, 28, 92, 0.12), transparent);
        opacity: 0;
      }

      /* Price line */
      .price-line {
        fill: none;
        stroke: #f1f5f9;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 4px rgba(241, 245, 249, 0.2));
      }

      .price-dot {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #f1f5f9;
        border-radius: 50%;
        box-shadow: 0 0 12px #f1f5f9;
        transform: translate(-50%, -50%);
        top: 140px;
        left: 0;
        opacity: 0;
      }

      /* Badge */
      .safety-badge {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(230, 28, 92, 0.2);
        border: 1px solid #e61c5c;
        color: #f1f5f9;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.5px;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-composition-id="root" data-width="600" data-height="600" data-start="0">
      <div id="scene-biz" class="scene clip" data-start="0" data-duration="4" data-track-index="1">
        <div class="grid-bg"></div>
        <div class="glow-bg"></div>
        <div class="scene-content">
          <div class="header-area">
            <span class="category">Pillar I • Doanh nghiệp</span>
            <h2 class="title">Business Mindset</h2>
          </div>
          
          <div class="chart-container">
            <div class="safety-zone"></div>
            <div class="intrinsic-line"></div>
            <span class="intrinsic-label">GIÁ TRỊ NỘI TẠI</span>
            
            <svg width="520" height="320" style="position: absolute; top: 0; left: 0;">
              <!-- Price path that goes below intrinsic (140px) into safety zone -->
              <path id="price-path" class="price-line" d="M 0 110 C 60 70, 110 80, 160 170 C 210 260, 260 210, 310 195 C 360 180, 410 90, 460 100 C 490 105, 520 120, 520 120" style="stroke-dasharray: 600; stroke-dashoffset: 600;" />
            </svg>
            <div class="price-dot"></div>
            
            <div class="safety-badge">BIÊN AN TOÀN ĐẠT MỨC +35%</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Initial states
      gsap.set(".safety-badge", { y: 10 });

      // Path data coords tracing
      const pathPoints = [
        { x: 0, y: 110 },
        { x: 50, y: 85 },
        { x: 100, y: 78 },
        { x: 160, y: 170 },
        { x: 210, y: 260 }, // deep dip
        { x: 260, y: 210 },
        { x: 310, y: 195 },
        { x: 360, y: 180 },
        { x: 410, y: 90 },
        { x: 460, y: 100 },
        { x: 520, y: 120 }
      ];

      const dot = document.querySelector(".price-dot");
      
      // Animate price path drawing
      tl.to("#price-path", {
        strokeDashoffset: 0,
        duration: 2.8,
        ease: "none"
      }, 0.2);

      // Dot movement along simulated coordinates
      gsap.set(dot, { left: pathPoints[0].x, top: pathPoints[0].y, opacity: 0 });
      tl.to(dot, { opacity: 1, duration: 0.1 }, 0.2);

      const stepDuration = 2.7 / (pathPoints.length - 1);
      for (let i = 1; i < pathPoints.length; i++) {
        tl.to(dot, {
          left: pathPoints[i].x,
          top: pathPoints[i].y,
          duration: stepDuration,
          ease: "none"
        }, 0.2 + (i - 1) * stepDuration);
      }

      // Safety zone and badge fades in during deep dip (points 3 to 7, approx t=0.9s to t=1.9s)
      tl.to(".safety-zone", {
        opacity: 1,
        duration: 0.4,
        ease: "power2.out"
      }, 0.9);

      tl.to(".safety-badge", {
        opacity: 1,
        y: 0,
        duration: 0.4,
        ease: "power2.out"
      }, 1.1);

      // Outro and reset
      tl.to(".safety-zone", { opacity: 0, duration: 0.3 }, 3.5);
      tl.to(".safety-badge", { opacity: 0, y: 10, duration: 0.3 }, 3.5);
      tl.to(dot, { opacity: 0, duration: 0.3 }, 3.5);
      tl.to("#price-path", { opacity: 0, duration: 0.3 }, 3.5);

      window.__timelines["root"] = tl;
    </script>
  </body>
</html>
